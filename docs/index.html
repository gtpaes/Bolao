<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bolão de futebol — palpites, tickets e ranking." />
  <meta name="theme-color" content="#0f8a45" />
  <title>Bolão de futebol</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- ===== Shell principal do app ===== -->
  <div class="app">
    <!-- Sidebar (desktop) -->
    <aside class="app-sidebar" aria-label="Menu principal">
      <a class="sb-brand" href="#/" data-goto-home style="text-decoration:none">
        <span class="logo-mark"><i data-lucide="trophy"></i></span>
        <div>
          <div class="logo-text">Bolão</div>
          <div class="logo-sub">Futebol</div>
        </div>
      </a>
      <nav class="sb-nav" id="sb-nav" aria-label="Navegação"></nav>
      <div class="sb-footer">
        <button class="btn btn-ghost btn-block btn-sm" data-logout>
          <i data-lucide="log-out"></i> Sair
        </button>
      </div>
    </aside>

    <!-- Header -->
    <header class="app-header">
      <button class="icon-btn header-menu-btn" id="menu-btn" aria-label="Abrir menu" aria-expanded="false">
        <i data-lucide="menu"></i>
      </button>
      <h1 class="h-title" id="page-title">Dashboard</h1>
      <div class="header-right">
        <button class="icon-btn" data-theme-toggle aria-label="Alternar tema"><i data-lucide="moon"></i></button>
        <a href="#/profile" id="header-chip" aria-label="Meu perfil" style="text-decoration:none"></a>
      </div>
    </header>

    <!-- Conteúdo -->
    <main class="app-main" id="app-main">
      <div class="page">
        <div id="app-view" tabindex="-1"></div>
      </div>
    </main>
  </div>

  <!-- Bottom navigation (mobile) -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="Navegação inferior"></nav>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
