<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova senha · Bolão</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body><main class="auth-main"><div class="auth-card"><h1 class="auth-heading">Criar nova senha</h1><p class="auth-sub">Escolha uma senha com pelo menos 8 caracteres.</p><form id="reset-form"><div class="field"><label for="password">Nova senha</label><input class="input" id="password" type="password" minlength="8" required></div><div class="field"><label for="confirm">Confirmar senha</label><input class="input" id="confirm" type="password" minlength="8" required></div><button class="btn btn-primary btn-lg btn-block" id="submit-btn">Salvar nova senha</button></form><div class="auth-alt"><a href="login.html">Voltar para entrar</a></div></div></main><script type="module" src="js/reset-password.js"></script></body>
</html>
